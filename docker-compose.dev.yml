services:
  mongodb:
    image: mongo:7.0
    container_name: ${CLIENT_SLUG:-toyoland}-mongodb-dev
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-11223345}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-toyoland-store}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${CLIENT_SLUG:-toyoland}-backend-dev
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-5092}
    ports:
      - "${BACKEND_PORT:-5092}:${BACKEND_PORT:-5092}"
    volumes:
      - /var/www/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - app-network

  frontend:
    build:
      context: ./${FRONTEND_DIR:-toyoland}
      dockerfile: Dockerfile
    container_name: ${CLIENT_SLUG:-toyoland}-frontend-dev
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8001}:8006"
    networks:
      - app-network

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:5092}
    container_name: ${CLIENT_SLUG:-toyoland}-dashboard-dev
    restart: always
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8005}:8005"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb-data-dev:
    driver: local